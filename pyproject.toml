[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-station-gui"
version = "0.1.0"
description = "Graphical interface for controlling a microscope probe station"
authors = [{ name = "Probe Station Team" }]
requires-python = ">=3.9"
dependencies = [
    "gdstk",
    "numpy",
    "opencv-python",
    "fastapi",
    "PySide6",
    "python-telegram-bot>=20,<23",
    "plotly",
    "pyqtgraph",
    "rotpy",
    "scipy",
    "uvicorn",
]

[project.optional-dependencies]
lcr = [
    "probe-station-measure @ file:///C:/Users/Public/code/probe_station_measure",
    "pyvisa",
    "qcodes",
]

[tool.setuptools]
packages = [
    "probe_station_gui",
    "probe_station_gui.views",
    "probe_station_gui.dialogs",
]

[tool.setuptools.package-data]
"probe_station_gui" = ["default_settings.json"]
