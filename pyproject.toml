[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-station-gui"
version = "0.1.0"
description = "Graphical interface for controlling a microscope probe station"
authors = [{ name = "Probe Station Team" }]
requires-python = ">=3.9"
dependencies = [
    "klayout==0.30.9",
    "numpy",
    "opencv-python",
    "fastapi",
    "PySide6",
    "python-telegram-bot>=20,<23",
    "plotly",
    "pyqtgraph",
    "rotpy",
    "scipy",
    "tqdm",
    "uvicorn",
]

[project.optional-dependencies]
client = [
    "keyring",
]
qcodes-client = [
    "keyring",
    "qcodes",
]
lcr = [
    "pyvisa",
    "qcodes",
    "keyring",
]
dev = [
    "import-linter==1.12.1; python_version < '3.10'",
    "import-linter==2.12; python_version >= '3.10'",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "probe_station_client*",
    "probe_station_gui*",
    "probe_station_measure*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
"probe_station_gui" = ["default_settings.json", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "_rotpy_src",
    ".claude",
    "build",
    "dist",
]

[tool.importlinter]
root_package = "probe_station_gui"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "domain-no-application"
name = "Domain packages do not import the application shell"
type = "forbidden"
source_modules = [
    "probe_station_gui.api",
    "probe_station_gui.camera",
    "probe_station_gui.coordinates",
    "probe_station_gui.design",
    "probe_station_gui.dialogs",
    "probe_station_gui.instruments",
    "probe_station_gui.notifications",
    "probe_station_gui.route",
    "probe_station_gui.settings",
    "probe_station_gui.shared",
    "probe_station_gui.stage",
    "probe_station_gui.views",
]
forbidden_modules = ["probe_station_gui.application"]

[[tool.importlinter.contracts]]
id = "shared-bottom"
name = "Shared stays below application and domain packages"
type = "forbidden"
source_modules = ["probe_station_gui.shared"]
forbidden_modules = [
    "main",
    "probe_station_gui.api",
    "probe_station_gui.application",
    "probe_station_gui.camera",
    "probe_station_gui.coordinates",
    "probe_station_gui.design",
    "probe_station_gui.dialogs",
    "probe_station_gui.instruments",
    "probe_station_gui.notifications",
    "probe_station_gui.route",
    "probe_station_gui.settings",
    "probe_station_gui.stage",
    "probe_station_gui.views",
]

[[tool.importlinter.contracts]]
id = "route-no-gui-composition"
name = "Route stays independent of application and GUI composition"
type = "forbidden"
source_modules = ["probe_station_gui.route"]
forbidden_modules = [
    "main",
    "probe_station_gui.application",
    "probe_station_gui.views",
]

[[tool.importlinter.contracts]]
id = "api-no-gui-composition"
name = "API transport stays independent of application and GUI composition"
type = "forbidden"
source_modules = ["probe_station_gui.api"]
forbidden_modules = [
    "main",
    "probe_station_gui.application",
    "probe_station_gui.dialogs",
    "probe_station_gui.views",
]

[[tool.importlinter.contracts]]
id = "route-run-execution-slot-leaf"
name = "Route run execution slot stays independent of callers and route policy"
type = "forbidden"
source_modules = ["probe_station_gui.application.route_run_execution"]
forbidden_modules = [
    "main",
    "probe_station_gui.route",
    "probe_station_gui.dialogs",
    "probe_station_gui.views",
    "probe_station_gui.application.route_launch_setup",
    "probe_station_gui.application.route_capture_run",
    "probe_station_gui.application.route_control",
    "probe_station_gui.application.route_results",
    "probe_station_gui.application.api_stage_contact",
    "probe_station_gui.application.api_route_scan",
]
