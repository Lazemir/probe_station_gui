[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-station-gui"
version = "0.1.0"
description = "Graphical interface for controlling a microscope probe station"
authors = [{ name = "Probe Station Team" }]
requires-python = ">=3.9"
dependencies = [
    "gdstk",
    "klayout==0.30.9",
    "numpy",
    "opencv-python",
    "fastapi",
    "PySide6",
    "python-telegram-bot>=20,<23",
    "plotly",
    "pyqtgraph",
    "rotpy",
    "scipy",
    "tqdm",
    "uvicorn",
]

[project.optional-dependencies]
client = [
    "keyring",
]
qcodes-client = [
    "keyring",
    "qcodes",
]
lcr = [
    "pyvisa",
    "qcodes",
    "keyring",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "probe_station_client*",
    "probe_station_gui*",
    "probe_station_measure*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
"probe_station_gui" = ["default_settings.json", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "_rotpy_src",
    ".claude",
    "build",
    "dist",
]
